<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI & Health Calculator - VICTORS</title>
    <meta name="description" content="Calculate Body Mass Index (BMI) and healthy body weight categories.">
    <meta name="google-site-verification" content="-nL85juUcE0o48CM-D_4I4YDGWaBoP1PN6BFCYSphl0" />
    <meta name="google-site-verification" content="FZkuRB-0Q_93gsD0MqGl-AYHHhZEO5352zcOegGGKi4" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-layer-group logo-icon"></i><span class="logo-text">VICTORS</span></a>
            <nav class="nav-links"><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></nav>
        </div>
    </header>

    <main class="page-container">
        <h1><i class="fa-solid fa-heart-pulse" style="color: var(--danger);"></i> BMI & Fitness Calculator</h1>
        <p class="subtitle">Enter your weight and height to compute your Body Mass Index (BMI).</p>

        <div class="tool-box">
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <div class="form-group" style="flex: 1;">
                    <label for="weightKg">Weight (kg):</label>
                    <input type="number" id="weightKg" placeholder="e.g. 70" class="form-input">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="heightCm">Height (cm):</label>
                    <input type="number" id="heightCm" placeholder="e.g. 175" class="form-input">
                </div>
            </div>
            <button id="btnCalcBMI" class="btn btn-primary"><i class="fa-solid fa-calculator"></i> Calculate BMI</button>
            <div class="result-box" id="bmiResult">Result will appear here.</div>
        </div>
    </main>

    <script>
        document.getElementById("btnCalcBMI").addEventListener("click", () => {
            const w = parseFloat(document.getElementById("weightKg").value);
            const h = parseFloat(document.getElementById("heightCm").value) / 100;
            const resBox = document.getElementById("bmiResult");
            if (isNaN(w) || isNaN(h) || h <= 0) { resBox.innerHTML = `<span style="color: var(--danger);">Enter valid weight and height.</span>`; return; }

            const bmi = (w / (h * h)).toFixed(1);
            let category = "Normal";
            if (bmi < 18.5) category = "Underweight";
            else if (bmi >= 25 && bmi < 30) category = "Overweight";
            else if (bmi >= 30) category = "Obese";

            resBox.innerHTML = `<strong>BMI Score:</strong> ${bmi} (${category})`;
        });
    </script>
</body>
</html>
