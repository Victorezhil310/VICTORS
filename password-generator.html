<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strong Password & PIN Generator - VICTORS</title>
    <meta name="description" content="Generate secure, strong passwords and PINs for online accounts free online.">
    <meta name="google-site-verification" content="-nL85juUcE0o48CM-D_4I4YDGWaBoP1PN6BFCYSphl0" />
    <meta name="google-site-verification" content="FZkuRB-0Q_93gsD0MqGl-AYHHhZEO5352zcOegGGKi4" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-layer-group logo-icon"></i><span class="logo-text">VICTORS</span></a>
            <nav class="nav-links"><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></nav>
        </div>
    </header>

    <main class="page-container">
        <h1><i class="fa-solid fa-key" style="color: var(--success);"></i> Strong Password Generator</h1>
        <p class="subtitle">Generate high-entropy random passwords and PINs to protect your accounts.</p>

        <div class="tool-box">
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <label for="passLength">Length:</label>
                <input type="number" id="passLength" value="16" min="6" max="64" class="form-input" style="width: 100px;">
                <button id="btnGeneratePass" class="btn btn-primary"><i class="fa-solid fa-shield-halved"></i> Generate Password</button>
            </div>
            <div class="result-box" id="passResult" style="font-family: monospace; font-size: 1.2rem; font-weight: 700; color: var(--secondary-color);">Click generate above.</div>
        </div>
    </main>

    <script>
        document.getElementById("btnGeneratePass").addEventListener("click", () => {
            const len = Math.max(6, Math.min(64, parseInt(document.getElementById("passLength").value) || 16));
            const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?";
            let pwd = "";
            for (let i = 0; i < len; i++) pwd += charset.charAt(Math.floor(Math.random() * charset.length));
            document.getElementById("passResult").textContent = pwd;
        });
    </script>
</body>
</html>
