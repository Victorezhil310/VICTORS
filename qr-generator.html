<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile QR Code Generator - VICTORS</title>
    <meta name="description" content="Generate instant QR codes for URLs, text, Wi-Fi, and contacts online.">
    <meta name="google-site-verification" content="-nL85juUcE0o48CM-D_4I4YDGWaBoP1PN6BFCYSphl0" />
    <meta name="google-site-verification" content="FZkuRB-0Q_93gsD0MqGl-AYHHhZEO5352zcOegGGKi4" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-layer-group logo-icon"></i><span class="logo-text">VICTORS</span></a>
            <nav class="nav-links"><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></nav>
        </div>
    </header>

    <main class="page-container">
        <h1><i class="fa-solid fa-qrcode" style="color: var(--secondary-color);"></i> Mobile QR Code Maker</h1>
        <p class="subtitle">Convert any web link, phone number, or text into a mobile readable QR Code.</p>

        <div class="tool-box">
            <input type="text" id="qrInput" placeholder="Enter URL or text..." class="form-input">
            <button id="btnGenerateQR" class="btn btn-primary"><i class="fa-solid fa-qrcode"></i> Generate QR Code</button>
            <div class="qr-display" id="qrDisplay"></div>
        </div>
    </main>

    <script>
        document.getElementById("btnGenerateQR").addEventListener("click", () => {
            const text = document.getElementById("qrInput").value.trim();
            const qrDisplay = document.getElementById("qrDisplay");
            if (!text) { qrDisplay.innerHTML = `<span style="color: var(--danger);">Enter text or URL first.</span>`; return; }
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(text)}`;
            qrDisplay.innerHTML = `
                <div style="text-align: center;">
                    <img src="${qrUrl}" alt="QR Code" style="border-radius: 8px; margin-bottom: 0.5rem; border: 4px solid white;">
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Scan QR Code with your phone camera.</p>
                </div>
            `;
        });
    </script>
</body>
</html>
