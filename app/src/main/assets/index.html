<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VICTORS - Smart AI & Multi-Utility App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-wand-magic-sparkles logo-icon"></i>
                <span class="logo-text">VICTORS</span>
                <span class="badge">AI APP</span>
            </a>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search AI tools, PDF, Kids quiz...">
            </div>
            <button id="themeToggle" class="theme-btn"><i class="fa-solid fa-moon"></i></button>
        </div>
    </header>

    <section class="hero-section">
        <div class="hero-content">
            <span class="hero-tag"><i class="fa-solid fa-robot"></i> VICTORS AI & Utility Suite</span>
            <h1>Smart Utilities & AI Assistant</h1>
            <p>Optimized for Mobile, Tablet, Desktop, and Android XR.</p>
        </div>
    </section>

    <main class="main-container">
        <section class="categories-nav">
            <button class="cat-btn active" data-category="all"><i class="fa-solid fa-border-all"></i> All</button>
            <button class="cat-btn" data-category="ai"><i class="fa-solid fa-brain"></i> AI Tools</button>
            <button class="cat-btn" data-category="students"><i class="fa-solid fa-graduation-cap"></i> Education</button>
            <button class="cat-btn" data-category="pdf"><i class="fa-solid fa-file-pdf"></i> PDF</button>
            <button class="cat-btn" data-category="kids"><i class="fa-solid fa-child"></i> Kids</button>
            <button class="cat-btn" data-category="mobile"><i class="fa-solid fa-mobile-screen-button"></i> Mobile</button>
        </section>

        <section class="store-section" id="apps">
            <div class="section-header">
                <h2><i class="fa-solid fa-layer-group"></i> Installed Suite Modules</h2>
                <span class="count-badge" id="appCount">Showing Tools</span>
            </div>
            <div class="apps-grid" id="appsGrid"></div>
        </section>
    </main>

    <div class="modal" id="toolModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
