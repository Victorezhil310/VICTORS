<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette & HEX Picker - VICTORS</title>
    <meta name="description" content="Select colors, convert HEX to RGB codes, and copy CSS color values.">
    <meta name="google-site-verification" content="-nL85juUcE0o48CM-D_4I4YDGWaBoP1PN6BFCYSphl0" />
    <meta name="google-site-verification" content="FZkuRB-0Q_93gsD0MqGl-AYHHhZEO5352zcOegGGKi4" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-layer-group logo-icon"></i><span class="logo-text">VICTORS</span></a>
            <nav class="nav-links"><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></nav>
        </div>
    </header>

    <main class="page-container">
        <h1><i class="fa-solid fa-palette" style="color: var(--primary-color);"></i> Color Palette & HEX Picker</h1>
        <p class="subtitle">Pick colors and copy CSS HEX / RGB codes for design projects.</p>

        <div class="tool-box">
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <input type="color" id="colorVal" value="#4f46e5" style="width: 80px; height: 50px; cursor: pointer; border: none; border-radius: 8px;">
                <div id="colorCode" style="font-size: 1.3rem; font-weight: 700; color: var(--secondary-color);">HEX: #4F46E5</div>
            </div>
            <button id="btnCopyColor" class="btn btn-primary"><i class="fa-solid fa-copy"></i> Copy Color HEX</button>
        </div>
    </main>

    <script>
        const colorVal = document.getElementById("colorVal");
        const colorCode = document.getElementById("colorCode");

        colorVal.addEventListener("input", (e) => {
            colorCode.textContent = `HEX: ${e.target.value.toUpperCase()}`;
        });

        document.getElementById("btnCopyColor").addEventListener("click", () => {
            navigator.clipboard.writeText(colorVal.value.toUpperCase());
            alert(`Copied ${colorVal.value.toUpperCase()} to clipboard!`);
        });
    </script>
</body>
</html>
